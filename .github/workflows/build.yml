name: Build

on:
  push:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: 8
        distribution: temurin
    - run: mvn -B clean package --no-transfer-progress
    - uses: actions/upload-artifact@v4
      with:
        name: formscanner
        path: formscanner-distribution/target/formscanner-*-bin.zip
    - uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/publish-master'
      with:
        name: Latest Snapshot
        body: Download the latest snapshot from the master branch.
        files: formscanner-distribution/target/formscanner-*-bin.zip